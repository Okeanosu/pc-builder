# Builds the api and web images for arm64, pushes them to ECR and deploys them on the AWS server.
# No AWS keys are stored in GitHub: the job gets one-hour credentials through OIDC, and only when it runs in the
# protected "production" environment (see docs/deploy-aws.md). Third-party actions are pinned to commit SHAs.
name: Deploy (AWS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back: full commit SHA whose images are already in ECR. Empty = build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Scan history for leaked secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  deploy:
    name: Build and deploy
    needs: secret-scan
    # Skipped until the AWS setup is done and the repository variables exist.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      DOMAIN: ${{ vars.DOMAIN }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      REQUESTED_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the image tag
        id: tag
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_SHA}"
          if [[ ! "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character commit SHA"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # Tags are immutable, so an image that already exists (re-run, rollback) is reused instead of rebuilt.
      - name: Find images to build
        id: missing
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          for app in api web; do
            if aws ecr describe-images --repository-name "pcbuilder/$app" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$app=present" >> "$GITHUB_OUTPUT"
            elif [ -n "$REQUESTED_TAG" ]; then
              echo "::error::pcbuilder/$app:$TAG is not in ECR; a rollback can only use images built before"
              exit 1
            else
              echo "$app=missing" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.missing.outputs.api == 'missing' || steps.missing.outputs.web == 'missing'

      - name: Build and push api
        if: steps.missing.outputs.api == 'missing'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/pcbuilder/api:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        if: steps.missing.outputs.web == 'missing'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
          tags: ${{ vars.ECR_REGISTRY }}/pcbuilder/web:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy on the server
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: infra/aws/scripts/ssm-deploy.sh "$INSTANCE_ID" "$TAG"

      - name: Check the public site
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://$DOMAIN/api/health"; then
              echo
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://$DOMAIN/api/health did not answer"
          exit 1
