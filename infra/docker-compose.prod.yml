name: pcbuilder-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-pcbuilder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-pc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pcbuilder}
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in infra/.env.prod}${PUBLIC_PORT_SUFFIX:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  web:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in infra/.env.prod}${PUBLIC_PORT_SUFFIX:-}/api
        NEXT_PUBLIC_SHOW_DESIGN: ${NEXT_PUBLIC_SHOW_DESIGN:-}
    environment:
      # Server-side rendering calls the API inside the compose network; the public URL is not reachable
      # from the container (e.g. https://localhost:8443 in the local demo).
      API_INTERNAL_URL: http://api:4000/api
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
