# Production stack on the AWS host (/opt/pcbuilder/compose.yml, written by the pcbuilder-deploy SSM document).
# Same services as infra/docker-compose.prod.yml, but the app images come prebuilt from ECR, tagged with a commit
# SHA, and .env is rendered from Parameter Store by host/render-env.sh. API_IMAGE, WEB_IMAGE and IMAGE_TAG come
# from host/lib.sh.
name: pcbuilder

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [internal]

services:
  postgres:
    <<: *service
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *service
    image: ${API_IMAGE:?}:${IMAGE_TAG:?}
    cap_drop: [ALL]
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: https://${DOMAIN:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # No secrets: the web container only gets the internal API address.
  web:
    <<: *service
    image: ${WEB_IMAGE:?}:${IMAGE_TAG:?}
    cap_drop: [ALL]
    environment:
      API_INTERNAL_URL: http://api:4000/api
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *service
    image: public.ecr.aws/docker/library/caddy:2-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
